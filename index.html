<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HardGen</title>
<style>
:root{--bg:#f4f2f0;--sf:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--ac:#e5242b;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--sf:#1a1a1e;--tx:#f2f2f2;--mu:#9a9aa2;--bd:#2c2c33}}
:root[data-theme="dark"]{--bg:#0e0e10;--sf:#1a1a1e;--tx:#f2f2f2;--mu:#9a9aa2;--bd:#2c2c33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{letter-spacing:.15em;margin:8px 0 0;font-size:26px}
section{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0}
h2{font-size:15px;margin:0 0 10px}
.btn,button{display:block;width:100%;text-align:center;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px;font:600 16px system-ui;margin:8px 0;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:13px}
select{width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-size:16px;margin:4px 0 10px}
input[type=range]{width:100%;margin:4px 0 10px;accent-color:var(--ac)}
canvas{width:100%;height:70px;display:block;border-radius:8px;background:var(--bg)}
audio{width:100%;margin-top:6px}
</style></head><body><main>
<h1>HARDGEN</h1><div class="mu">Hard techno · Gabber · Uptempo · 130-200 BPM</div>

<section><h2>1 · Morceau de référence</h2>
<label class="btn">Importer depuis mon téléphone<input type="file" id="ref" hidden></label>
<div id="ri" class="mu">Aucun morceau : structure par défaut utilisée.</div>
<canvas id="cv"></canvas></section>

<section><h2>2 · Tes samples</h2>
<label class="btn s">+ Kicks<input type="file" id="sk" multiple hidden></label>
<label class="btn s">+ Percussions / hats<input type="file" id="sp" multiple hidden></label>
<label class="btn s">+ Basses<input type="file" id="sb" multiple hidden></label>
<label class="btn s">+ Synthés / screeches / stabs<input type="file" id="ss" multiple hidden></label>
<div id="si" class="mu"></div></section>

<section><h2>3 · Style</h2>
<select id="pre"></select>
<div>BPM : <b id="bv"></b></div><input type="range" id="bpm" min="130" max="200" value="150">
<div>Distorsion du kick : <b id="dv"></b></div><input type="range" id="dist" min="0" max="100" value="5">
<div>Tonalité</div><select id="key"></select>
<div>Mesures sans référence : <b id="lv">64</b></div><input type="range" id="len" min="32" max="128" step="8" value="64">
<button id="go">Générer le morceau</button><div id="msg" class="mu"></div></section>

<section id="out" hidden><h2>Résultat</h2><audio id="au" controls></audio>
<a id="dl" class="btn" download="hardgen.wav">Télécharger en WAV</a></section>
</main>
<script>
const $=id=>document.getElementById(id),AC=window.AudioContext||window.webkitAudioContext;
const P={'Techno dur (130)':{b:130,d:2,k:.28,m:'rumble'},'Hard techno (150)':{b:150,d:5,k:.3,m:'rumble'},'Hard techno rapide (160)':{b:160,d:8,k:.26,m:'rumble'},'Gabber old school (170)':{b:170,d:25,k:.22,m:'stab'},'Gabber (180)':{b:180,d:40,k:.2,m:'stab'},'Uptempo (200)':{b:200,d:60,k:.16,m:'lead'}};
const DEF=[1,0,0,.8,0,0,.8,0,1,0,0,.8,0,0,.8,0],PROG=[0,-2,-4,-5];
const S={k:[],p:[],b:[],s:[]};let ref=null;
const pre=$('pre');Object.keys(P).forEach(k=>pre.add(new Option(k,k)));pre.value='Hard techno (150)';
['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].forEach((n,i)=>$('key').add(new Option(n+' mineur',i)));$('key').value=9;
const lab=()=>{$('bv').textContent=$('bpm').value;$('dv').textContent=$('dist').value};
const sync=()=>{const p=P[pre.value];$('bpm').value=p.b;$('dist').value=p.d;lab()};
pre.onchange=sync;$('bpm').oninput=lab;$('dist').oninput=lab;$('len').oninput=()=>$('lv').textContent=$('len').value;sync();
const info=()=>$('si').textContent=`Kicks ${S.k.length} · Percs ${S.p.length} · Basses ${S.b.length} · Synthés ${S.s.length}. Sons intégrés si vide.`;info();
async function dec(f){const c=new AC();try{return await c.decodeAudioData(await f.arrayBuffer())}finally{c.close&&c.close()}}
for(const [id,k] of [['sk','k'],['sp','p'],['sb','b'],['ss','s']])$(id).onchange=async e=>{S[k]=[];let bad=0;for(const f of [...e.target.files].slice(0,16)){try{S[k].push(await dec(f))}catch(_){bad++}}info();if(bad)$('si').textContent+=` (${bad} fichier(s) illisible(s))`};
const defEnv=n=>Array.from({length:n},(_,i)=>{const x=i/n;return x<.1?.3:x<.2?.3+.4*(x-.1)/.1:x<.45?1:x<.55?.05:x<.62?.3+.4*(x-.55)/.07:x<.9?1:.4});
const rs=(e,n)=>Array.from({length:n},(_,i)=>e[Math.min(e.length-1,Math.floor(i*e.length/n))]);
function draw(env){const c=$('cv'),w=c.width=c.clientWidth*2,h=c.height=140,x=c.getContext('2d');x.fillStyle='#e5242b';const bw=w/env.length;env.forEach((v,i)=>{const bh=Math.max(2,v*(h-6));x.fillRect(i*bw+1,h-bh,Math.max(1,bw-2),bh)})}
function analyse(buf){const sr=buf.sampleRate,ch=buf.getChannelData(0),H=512,nf=Math.floor(ch.length/H),fps=sr/H,e=new Float32Array(nf),f=new Float32Array(nf);
for(let i=0;i<nf;i++){let s=0;for(let j=0;j<H;j++){const v=ch[i*H+j];s+=v*v}e[i]=Math.sqrt(s/H)}
for(let i=1;i<nf;i++)f[i]=Math.max(0,e[i]-e[i-1]);
let bb=150,bs=-1;for(let m=65;m<=220;m+=.5){const L=Math.round(240/m*fps);let s=0;for(let i=0;i+L<nf;i++)s+=f[i]*f[i+L];s/=Math.max(1,nf-L);if(s>bs){bs=s;bb=m}}
while(bb<130)bb*=2;while(bb>200)bb/=2;
const beat=60/bb*fps;let off=0,bo=-1;for(let o=0;o<beat;o++){let s=0;for(let k=0;;k++){const i=Math.round(o+k*beat);if(i>=nf)break;s+=f[i]}if(s>bo){bo=s;off=o}}
const pat=new Float32Array(16);for(let i=0;i<nf;i++){const st=((Math.round((i-off)/beat*4)%16)+16)%16;pat[st]+=f[i]}
let mxo=0,mxa=0;pat.forEach((v,i)=>{mxa=Math.max(mxa,v);if(i%4)mxo=Math.max(mxo,v)});const use=mxo>.15*mxa;
const pt=Array.from(pat,(v,i)=>i%4==0?DEF[i]:use?v/mxo:DEF[i]);
const bf=240/bb*fps,nb=Math.floor(nf/bf),raw=[];for(let b=0;b<nb;b++){let s=0,c=0;for(let i=Math.floor(b*bf);i<Math.floor((b+1)*bf)&&i<nf;i++){s+=e[i];c++}raw.push(c?s/c:0)}
const sd=[...raw].sort((a,b)=>a-b),p=sd[Math.floor(.9*(sd.length-1))]||1;
const env=nb>=4?raw.map(v=>Math.min(1,v/p)):defEnv(32);
return{bpm:Math.round(bb),env,pat:pt,dur:buf.duration,nb}}
$('ref').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('ri').textContent='Analyse en cours…';
try{const b=await dec(f);ref=analyse(b);let best=pre.value,d=999;for(const k in P){const x=Math.abs(P[k].b-ref.bpm);if(x<d){d=x;best=k}}
pre.value=best;sync();$('bpm').value=ref.bpm;lab();$('ri').textContent=`${f.name} · ~${ref.bpm} BPM détectés · ${ref.nb} mesures`;draw(ref.env)}
catch(err){ref=null;$('ri').textContent='Fichier illisible. Formats conseillés : MP3, WAV, M4A, FLAC, OGG.'}};
draw(defEnv(64));
const crv=k=>{const c=new Float32Array(2048),a=1+k/6,m=Math.tanh(a);for(let i=0;i<2048;i++)c[i]=Math.tanh((i/1024-1)*a)/m;return c};
function wav(b){const n=b.length,d=new DataView(new ArrayBuffer(44+n*4)),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
w(0,'RIFF');d.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,b.sampleRate,true);d.setUint32(28,b.sampleRate*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*4,true);
const L=b.getChannelData(0),R=b.getChannelData(1);let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(L[i]),Math.abs(R[i]));const g=mx?.95/mx:1;
for(let i=0;i<n;i++){d.setInt16(44+i*4,L[i]*g*32767,true);d.setInt16(46+i*4,R[i]*g*32767,true)}return new Blob([d],{type:'audio/wav'})}
async function gen(){const btn=$('go');btn.disabled=true;btn.textContent='Génération…';$('msg').textContent='';
try{await new Promise(r=>setTimeout(r,30));
const pr=P[pre.value],bpm=+$('bpm').value,spb=60/bpm,bar=spb*4,key=+$('key').value;
let env=ref?ref.env:defEnv(+$('len').value);const nb=Math.max(8,Math.min(env.length,Math.floor(170/bar)));env=rs(env,nb);const pat=ref?ref.pat:DEF;
const oc=new OfflineAudioContext(2,Math.ceil((nb*bar+2)*44100),44100),mst=oc.createGain(),cp=oc.createDynamicsCompressor();mst.gain.value=.7;mst.connect(cp);cp.connect(oc.destination);
const ws=oc.createWaveShaper();ws.curve=crv(+$('dist').value);ws.oversample='4x';const kb=oc.createGain();kb.connect(ws);ws.connect(mst);
const nz=oc.createBuffer(1,44100,44100),nd=nz.getChannelData(0);for(let i=0;i<44100;i++)nd[i]=Math.random()*2-1;
const pick=a=>a[Math.floor(Math.random()*a.length)],fq=m=>440*2**((m-69)/12);
const pb=(b,t,d,v,r,mx)=>{const s=oc.createBufferSource(),g=oc.createGain();s.buffer=b;s.playbackRate.value=r;g.gain.value=v;s.connect(g);g.connect(d);s.start(t);s.stop(t+Math.min(b.duration/r,mx))};
const kick=(t,v)=>{if(S.k.length){pb(pick(S.k),t,kb,v,1,spb*.98);return}const o=oc.createOscillator(),g=oc.createGain(),d=Math.min(pr.k,spb*.95);o.frequency.setValueAtTime(pr.m=='rumble'?200:300,t);o.frequency.exponentialRampToValueAtTime(46,t+.1);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(kb);o.start(t);o.stop(t+d+.05)};
const noise=(t,d,type,fr,v)=>{const s=oc.createBufferSource(),f=oc.createBiquadFilter(),g=oc.createGain();s.buffer=nz;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mst);s.start(t);s.stop(t+d+.02)};
const hat=(t,o,v)=>{if(S.p.length&&!o)pb(pick(S.p),t,mst,v*.5,1,.25);else noise(t,o?.14:.04,'highpass',7500,v*.25)};
const clap=(t,v)=>noise(t,.12,'bandpass',1800,v*.5);
const bs=(t,m,d,v)=>{if(S.b.length){pb(pick(S.b),t,mst,v*.8,1,d*1.5);return}const o=oc.createOscillator(),f=oc.createBiquadFilter(),g=oc.createGain();o.type='sawtooth';o.frequency.value=fq(m);f.type='lowpass';f.frequency.value=pr.m=='rumble'?140:220;g.gain.setValueAtTime(v*.5,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(f);f.connect(g);g.connect(mst);o.start(t);o.stop(t+d+.02)};
const syn=(t,m,d,v)=>{if(S.s.length){pb(pick(S.s),t,mst,v*.6,1,spb/2);return}const lp=oc.createBiquadFilter(),g=oc.createGain();lp.type='lowpass';lp.Q.value=pr.m=='lead'?10:6;lp.frequency.setValueAtTime(pr.m=='lead'?5000:3000,t);lp.frequency.exponentialRampToValueAtTime(400,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.18,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+d);[-9,9].forEach(x=>{const o=oc.createOscillator();o.type='sawtooth';o.frequency.value=fq(m);o.detune.value=x;o.connect(lp);o.start(t);o.stop(t+d+.05)});lp.connect(g);g.connect(mst)};
for(let b=0;b<nb;b++){const e=env[b],t0=b*bar,v=.65+.35*e,ch=PROG[Math.floor(b/2)%4],up=b+1<nb&&env[b+1]-e>.2;
if(e>.12)for(let k=0;k<4;k++)kick(t0+k*spb,v);
if(e>.22)for(let k=0;k<4;k++)hat(t0+k*spb+spb/2,true,v*.7);
if(e>.5)for(let s=1;s<16;s+=2)if(pat[s]>.35)hat(t0+s*spb/4,false,.5);
if(e>.4){clap(t0+spb,v);clap(t0+3*spb,v)}
if(e>.2)for(let k=0;k<4;k++)bs(t0+k*spb+spb/2,24+key+ch,spb*.45,v);
if(e>.6)for(let s=0;s<16;s++)if(pat[s]>.5)syn(t0+s*spb/4,48+key+ch+(pr.m=='lead'?[0,12,7,12][s%4]:pr.m=='stab'&&s%8?12*(s%2):0),spb/3,v);
if(up)for(let s=0;s<16;s++)clap(t0+s*spb/4,.15+.6*s/16)}
const out=await oc.startRendering(),u=URL.createObjectURL(wav(out));$('au').src=u;$('dl').href=u;$('out').hidden=false;
$('msg').textContent=`Terminé : ${nb} mesures · ${bpm} BPM · ${Math.round(nb*bar)} s`;$('out').scrollIntoView({behavior:'smooth'})}
catch(err){$('msg').textContent='Erreur : '+err.message}
btn.disabled=false;btn.textContent='Générer le morceau'}
$('go').onclick=gen;
if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){
$('dl').addEventListener('click',async e=>{e.preventDefault();try{
const b=await (await fetch($('dl').href)).blob();
const data=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const {Filesystem,Share}=Capacitor.Plugins;
const w=await Filesystem.writeFile({path:'hardgen.wav',data,directory:'CACHE'});
await Share.share({title:'HardGen',url:w.uri})}catch(err){$('msg').textContent='Export : '+err.message}})}

</script></body></html>
